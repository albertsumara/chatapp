version: '3.8'

services:
  chatapp:
    build: .
    image: chatapp:latest
    container_name: chatapp
    ports:
      - "8080:8080"
    #    volumes:
    #      - ./target/classes:/app/classes
    #      - ./src/main/resources/static:/app/static
    environment:
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chatapp_cymb
      SPRING_DATASOURCE_USERNAME: chatappuser
      SPRING_DATASOURCE_PASSWORD: 5JrgQGIriOiHI0mhdd2kAJRaCdIVHAnf
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: chatapp_db
    environment:
      POSTGRES_DB: chatapp_cymb
      POSTGRES_USER: chatappuser
      POSTGRES_PASSWORD: 5JrgQGIriOiHI0mhdd2kAJRaCdIVHAnf
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
